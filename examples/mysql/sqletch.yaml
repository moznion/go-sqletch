version: 1
dialect: mysql
server_version: "8.4"
database:
  # dsn: user@tcp(h)/db      # optional, literal only (no ${VAR}); empty = disposable testcontainers MySQL
schema:
  files: [db/schema.sql]
targets:
  - queries: [queries/*.sql]
    output:
      package: gen
      path: gen

# Opt into the SQLETCHLnnn performance lints (warnings only); `sqletch
# check --lint=false` turns them off for one run.
lint: true

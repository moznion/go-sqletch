version: 1
dialect: postgres
# Pinned to the patch release: the auto-managed dev database image is
# derived from it, and a floating major tag would move the server under
# the committed cache (SQLETCH203 on the next cache miss).
server_version: "16.15"
database:
  # dsn: postgres://…  # optional, literal only (no ${VAR}); empty = disposable container
schema:
  files:
    - db/schema.sql
targets:
  - queries:
      - queries/*.sql
    output:
      package: gen
      path: gen
cache:
  path: .sqletch/cache
# Optional: a deadline for every generated method whose query has no
# `-- @timeout` directive (queries/audit.sql shows the per-query form).
# query_timeout:
#   default: 5s
policies:
  - name: tenant_scope
    tables: [audit_logs]
    predicate: "{}.tenant_id = :tenant_id"
    param:
      name: tenant_id
      type: bigint

version: 1
dialect: postgres
server_version: "16"
database:
  # dsn: postgres://…  # optional, literal only (no ${VAR}); empty = disposable container
schema:
  files:
    - db/schema.sql
targets:
  - queries:
      - queries/*.sql
    output:
      package: gen
      path: gen
cache:
  path: .sqletch/cache
# Optional: a deadline for every generated method whose query has no
# `-- @timeout` directive (queries/audit.sql shows the per-query form).
# query_timeout:
#   default: 5s
policies:
  - name: tenant_scope
    tables: [audit_logs]
    predicate: "{}.tenant_id = :tenant_id"
    param:
      name: tenant_id
      type: bigint

# Opt into the SQLETCHLnnn performance lints (warnings only); `sqletch
# check --lint=false` turns them off for one run.
lint: true

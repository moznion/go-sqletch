version: 1
dialect: postgres
server_version: "16"
database:
  dsn: ${SQLETCH_DSN} # empty = start a disposable container
schema:
  files:
    - db/schema.sql
queries:
  - queries/*.sql
output:
  package: gen
  path: gen
cache:
  path: .sqletch/cache
policies:
  - name: tenant_scope
    tables: [audit_logs]
    predicate: "{}.tenant_id = :tenant_id"
    param:
      name: tenant_id
      type: bigint

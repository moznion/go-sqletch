name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  tagpr:
    name: release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tagpr pushes with GITHUB_TOKEN from the env below; the
          # credentials checkout would otherwise persist in .git/config
          # are unnecessary.
          persist-credentials: false
      - uses: Songmu/tagpr@0c4eb5a3b0862693702acea436a7c68bd586530d # v1.21.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

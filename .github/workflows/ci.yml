name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./...
      - name: Format check (goimports via gofmt-compatible output)
        run: |
          go run golang.org/x/tools/cmd/goimports@latest -l . | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out

  e2e:
    name: real-database E2E (-tags devdb)
    runs-on: ubuntu-latest # Docker preinstalled; testcontainers starts PostgreSQL 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: E2E suite (property test, generated module, CLI round-trip)
        run: go test -tags devdb -v ./internal/e2e/
      - name: Offline check against the committed example caches
        run: |
          for d in postgres mysql sqlite; do
            go run ./cmd/sqletch check --config examples/$d/sqletch.yaml | tee /tmp/check-$d.out
            grep -q "offline: yes" /tmp/check-$d.out
          done

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # goinstall builds the linter with the module's own toolchain
          # (go.mod pins a 1.27 rc; released golangci-lint binaries are
          # built with the previous stable Go and refuse newer targets).
          # Drop this once golangci-lint ships go1.27-built binaries.
          install-mode: goinstall
          args: --build-tags devdb

  fuzz-smoke:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Scanner fuzz (30s, all three lexer profiles)
        run: go test ./internal/template -run '^$' -fuzz=FuzzScan -fuzztime=30s
      - name: Compose/render differential fuzz (30s)
        run: go test ./internal/codegen -run '^$' -fuzz=FuzzComposeConformance -fuzztime=30s
      # A crasher is written to testdata/fuzz/<target>/ inside the runner.
      # Without this the input is discarded with the runner and the finding
      # is unreproducible; commit the uploaded file to pin the regression.
      - name: Upload any crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            internal/template/testdata/fuzz/
            internal/codegen/testdata/fuzz/
          if-no-files-found: ignore

  grammars:
    name: editor grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: tree-sitter corpus tests
        working-directory: editors/tree-sitter-sqletch
        run: |
          npx --yes tree-sitter-cli@0.25 generate
          git diff --exit-code -- src/  # committed parser must match grammar.js
          npx --yes tree-sitter-cli@0.25 test
      - name: TextMate grammar tests
        working-directory: editors/vscode
        run: npx --yes vscode-tmgrammar-test -g syntaxes/sqletch.injection.tmLanguage.json 'tests/*.sql'

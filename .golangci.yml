version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks: ["all"]
    errcheck:
      # Terminal-output write errors are unactionable in a CLI.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/moznion/go-sqletch
